<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Variables</h1>


    <script>
        
        // global variable (var)
        var name = "Shwe Yee";
        name = "Wutt Hmone";
        console.log(name);

        // block scope variable (let)
        let fatherName = "U Ba";
        fatherName = "U Ba Update";
        console.log(fatherName);

        // const variable (const)
        const motherName = "Daw Hla";
        console.log(motherName);
        
    </script>
</body>
</html>
