<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    
    <h1>Student Register</h1>

    <form action="" name="myForm" onclick="return checkValidation()">

        <label for="name">Name</label><br>
        <input type="text" name="name" id="name">
        <span id="nameError"></span>
        <br><br>
        
        <label for="age">Age</label><br>
        <input type="number" name="age" id="age">
        <span id="ageError"></span>
        <br><br>

        <label for="address">Address</label><br>
        <textarea name="address" id="address"></textarea>
        <span id="addressError"></span>
        <br><br>

        <button type="button" onclick="showData()">Register</button>

    </form>


    <h1>Student Lists</h1>
    <table border="1" cellpadding="20" cellspacing="0">
        <thead>
            <tr>
                <th>No.</th>
                <th>Name</th>
                <th>Age</th>
                <th>Address</th>
            </tr>
        </thead>
        <tbody id="myTbody">

        </tbody>
    </table>

    <script>
        let studentList = [];
        function showData() {
           let name = document.getElementById('name').value;
           let age = document.getElementById('age').value;
           let address = document.getElementById('address').value;


           //create object
           let student = {
            name : name,
            age : age,
            address : address,
           }


           //create array
           studentList.push(student);

           // show data

           studentListdata();
        }

        function studentListdata(){
            
           let html = '';

           for (let i = 0; i < studentList.length; i++) {

            html += `
                <tr>
                    <td>${i + 1}</td>
                    <td>${studentList[i].name}</td>
                    <td>${studentList[i].age}</td>
                    <td>${studentList[i].address}</td>
                </tr>
            `; 
            
           }

           document.getElementById('myTbody').innerHTML = html;
        }

        function checkValidation() {
            let name = document.getElementById('name').value;
           let age = document.getElementById('age').value;
           let address = document.getElementById('address').value;

           let valid = true;
           if(name == ""){
            document.getElementById('name').setAttribute('style', 'border: 1px solid red;');
            document.getElementById('nameError').innerText = "Name is required!";
            document.getElementById('nameError').setAttribute('style', 'color: red;');
            document.getElementById('myTbody').innerHTML = none;
            return valid;
           }else{
            document.getElementById('name').removeAttribute('style');
            document.getElementById('nameError').innerText = "";
            document.getElementById('myTbody').innerHTML = html;
           }

           if(age == ""){
            document.getElementById('age').setAttribute('style', 'border: 1px solid red;');
            document.getElementById('ageError').innerText = "Age is required!";
            document.getElementById('ageError').setAttribute('style', 'color: red;');
            document.getElementById('myTbody').innerHTML = none;
            return valid;
           }else{
            document.getElementById('age').removeAttribute('style');
            document.getElementById('ageError').innerText = "";
            document.getElementById('myTbody').innerHTML = html;
           }

           if(address == ""){
            document.getElementById('address').setAttribute('style', 'border: 1px solid red;');
            document.getElementById('addressError').innerText = "Address is required!";
            document.getElementById('addressError').setAttribute('style', 'color: red;');
            document.getElementById('myTbody').innerHTML = none;
            return valid;
           }else{
            document.getElementById('address').removeAttribute('style');
            document.getElementById('addressError').innerText = "";
            document.getElementById('myTbody').innerHTML = html;
           }


        }
    </script>
</body>
</html>
