<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework</title>
</head>
<body>
    <script>
        let num = prompt("Enter the Number")

        for (let i = 1; i < 13; i++) {
            document.write(num + " " + "x" + " " + i + " " + "=" + " " + num * i + "<br>" )
            
        }

        for(let i = 0; i < 5; i++){
            for(let k = i; k < 5; k++){
                document.write("*");
            }
            document.write("<br>");
        }

    </script>
</body>
</html>
