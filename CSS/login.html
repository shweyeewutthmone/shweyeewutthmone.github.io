<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body style=" background-color: blue;" id="form">

    <form id="login" method="get" style="background-color: white;">
        <h1>Welcome Back!</h1>
        <p>Please login to your account</p>

        <div id="login">
            <label for="email">Email Address</label>
            <input type="email" name="stuEmail" id="email" placeholder="Enter your email">

            <br><br>

            <label for="password">Password</label>
            <input type="password" name="stuPassword" id="password" placeholder="Enter your password">
            <br><br>

            <input type="checkbox" name="remember" value="remember" id="remember">
            <label for="remember">Remeber me</label>

            <a href="">
                Forgot password?
            </a>

            <br><br>
           
            <button type="submit" class="button">
                Login
            </button>
            <br><br>

            <p align="center">
                Don't have an account?

                <a href="" class="signup">Sign Up</a>

            </p>
        </div>
    </form>
</body>
</html>
