<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="css/selector.css">
</head>
<body>
    <h1>Grid Lessons</h1>

    <div class="gridOne">
        <div style="background-color: red;">1</div>
        <div style="background-color: blue;">2</div>
        <div style="background-color: yellow;">3</div>
        <div style="background-color: green;">4</div>
        <div style="background-color: brown;">5</div>
        <div style="background-color: purple;">6</div>
        <div style="background-color: orange;">7</div>
        <div style="background-color: pink;">8</div>
        <div style="background-color: black;">9</div>
    </div>

    <h1>Grid Column Add</h1>

    <div class="gridTwo">
        <div style="background-color: red;">1</div>
        <div style="background-color: blue;">2</div>
        <div style="background-color: yellow;">3</div>
        <div style="background-color: green;">4</div>
        <div style="background-color: brown;" class="columnAdd">5</div>
        <div style="background-color: purple;">6</div>
        <div style="background-color: orange;">7</div>
        <div style="background-color: pink;">8</div>
        <div style="background-color: black;">9</div>
    </div>

    <h1>Grid Row Add</h1>

    <div class="gridThree">
        <div style="background-color: red;">1</div>
        <div style="background-color: blue;">2</div>
        <div style="background-color: yellow;">3</div>
        <div style="background-color: green;">4</div>
        <div style="background-color: brown;" class="rowAdd">5</div>
        <div style="background-color: purple;">6</div>
        <div style="background-color: orange;">7</div>
        <div style="background-color: pink;">8</div>
        <div style="background-color: black;">9</div>
    </div>

</body>
</html>
